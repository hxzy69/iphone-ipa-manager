name: Prepare verified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag matching the application version
        required: true
        type: string
      publish:
        description: Publish as Latest after validation (otherwise keep a draft)
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install stable --profile minimal --component rustfmt
      - name: Build, test and audit the tagged source
        shell: pwsh
        run: ./tools/build.ps1
      - name: Upload and verify release artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPO: ${{ github.repository }}
          MAKE_PUBLIC: ${{ inputs.publish }}
        run: |
          $publishArguments = @('tools/publish_release.py', '--tag', $env:RELEASE_TAG, '--repo', $env:RELEASE_REPO)
          if ($env:MAKE_PUBLIC -eq 'true') { $publishArguments += '--publish' }
          ./.venv/Scripts/python.exe @publishArguments
          exit $LASTEXITCODE
