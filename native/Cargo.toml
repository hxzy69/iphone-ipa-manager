[package]
name = "ipa-manager-native"
version = "0.1.1"
description = "Headless authentication and signing backend for iPhone IPA Manager"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "iloader-wifi"
path = "src/main.rs"

[patch.crates-io]
apple-codesign-quick = { path = "../vendor/apple-codesign-quick" }
isideload = { path = "../vendor/isideload" }
block-buffer = { path = "../vendor/block-buffer" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "=0.1.68", features = ["usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
isideload = { version = "=0.4.6", features = ["fs-storage"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
futures = "0.3.31"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "time"] }
rustls = "0.23.36"
plist = "1.8.0"
rootcause = "0.12.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[dev-dependencies]
# Keep the advisory regression test tied to the transitive version in use.
block-buffer = "=0.10.4"

[profile.release]
strip = "debuginfo"
# Do not resume a native worker after a Rust panic. The controller treats a
# terminated worker as an uncertain operation and requires explicit recovery.
panic = "abort"
