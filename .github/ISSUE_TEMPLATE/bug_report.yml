name: Bug report
description: Report a reproducible problem without sharing private data.
body:
  - type: markdown
    attributes:
      value: Do not upload live configuration, tokens, passwords, IPA files, provisioning profiles or pairing records. Review and redact logs first.
  - type: input
    id: version
    attributes:
      label: Application and Windows versions
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection used
      options:
        - USB
        - Local Wi-Fi
        - Remote Tailscale
        - No device involved
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Redacted error and relevant receipt status
      description: Remove account emails, device identifiers, local paths and other private information.
