[project]
name = "iphone-ipa-manager"
version = "0.4.1"
description = "Windows account, installation and renewal manager for iOS IPA files"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["vendor", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

