name: Windows validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r requirements-dev.txt
      - name: Install Rust MSVC toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check native formatting
        shell: pwsh
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path vendor/block-buffer/Cargo.toml --check
          exit $LASTEXITCODE
      - name: Build and validate without a device
        shell: pwsh
        run: ./tools/build.ps1
      - name: Save preview artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iphone-ipa-manager-preview-windows-x64
          path: artifacts/*
          if-no-files-found: error
